name: DRRR Room Bot Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: 執行開房腳本
        env:
          NICKNAME: ${{ vars.NICKNAME || '罌粟' }}
          TRIPCODE: ${{ vars.TRIPCODE || 'TW._.MIT' }}
          ROOM_NAME: ${{ vars.ROOM_NAME || '深渊凝视著你' }}
          ROOM_DESC: ${{ vars.ROOM_DESC || '与怪物战斗的人，应当小心自己不要变成怪物。当你凝视深渊时，深渊也在凝视着你。' }}
          ROOM_LIMIT: ${{ vars.ROOM_LIMIT || '2' }}
          DRRR_LANG: ${{ vars.DRRR_LANG || 'zh-TW' }}
          DRRR_COOKIE: ${{ secrets.DRRR_COOKIE }}
        run: python open_room.py
